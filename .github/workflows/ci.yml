name: CI - Intellillent

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        run: npm test

      # Análisis estático opcional (mejora C1 de la rúbrica): ESLint valida
      # estilo y errores de código sin ejecutarlo; complementa la suite de tests.
      - name: Análisis estático con ESLint
        run: npm run lint